; Enshrouded VR MOD - what "Enshrouded VR setting.exe" changes and "Start the game" (vrmod	ools\play.ps1) uses.
; EnshroudedVR.ini beside this file holds your own values; this file is how they came.

[Mode]
VR=1                ; 1 = play in VR with the headset, 0 = play on the monitor without VR

[Online]
Sync=0              ; 1 = other VR players' bodies are shown and yours is sent (mod to mod, Steam friends in your session)
Menu=0              ; 1 = the game starts at its own menu (join or host a session), 0 = it goes on with the last world

[Picture]
RenderScale=0.8     ; VR picture size: 0.7 low, 0.8 normal, 1.0 high
Dlss=Quality        ; VR: Quality, Balanced, Performance or Dlaa
Sharpness=0.2       ; VR: 0 .. 1

[Session]
Minutes=240         ; the mod stops by itself after this many minutes (1 .. 240)
