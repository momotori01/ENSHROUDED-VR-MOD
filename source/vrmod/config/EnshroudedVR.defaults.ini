; Enshrouded VR MOD - how the settings come. Your own values are in EnshroudedVR.ini beside this file
; ("Enshrouded VR setting.exe" writes them). They are read when the game starts.

[Mode]
VR=0                ; 1 = play in VR with the headset, 0 = play on the monitor without VR
Style=Motion        ; with VR=1: Motion = motion controllers (full VR), PadFirst = first person played with a gamepad, PadThird = the game's third-person view played with a gamepad

[Pad]
PitchLock=1         ; PadThird: 1 = the view stays level (the camera's up and down from the right stick is left out), 0 = it follows the game camera; also changed in the game
Tilt=0              ; PadFirst / PadThird: the view tilted down by this many degrees (0 .. 90) for playing lying down; 90 = lying on your back, looking at the ceiling is looking ahead

[Online]
Sync=1              ; 1 = other VR players' bodies are shown (and yours is sent while you play in VR); 0 = off

[Picture]
RenderScale=0.8     ; VR picture size: 0.7 low, 0.8 normal, 1.0 high
Sharpness=0.2       ; VR: 0 .. 1
AlternateEyes=0     ; VR: 1 = one eye drawn a frame, the other shows its last picture (faster; a test); 0 = both eyes
EyeWarp=0           ; VR, with AlternateEyes=1: 2 = the eye left out is made from the eye drawn in the frame, its last picture only in the holes (PureDark's way, a test); 1 = its last picture warped to the frame's pose; 0 = as it was drawn
UiAutoHide=1        ; VR: 1 = the HUD (health, quick slots...) fades out 5 s after its last change and comes back when something changes; 0 = always shown
GiQuality=High      ; VR: the game's GI quality while in VR - Performance, Balance, High or Ultra (High: the two eyes' indirect light agrees sooner); Keep = the game's own
FitView=Auto        ; VR: how each eye's picture is fitted to the headset's view - Auto = fitted only when the mod finds ALVR; Normal = as always; Fit = always fitted (choose it if the view is cross-eyed)

[Body]
RealCrouch=1        ; VR: 1 = lowering your head makes the character sneak; also changed in the game (start menu, VR settings)
CrouchDrop=30       ; VR: how far (percent of your standing eye height, 10 .. 50) the head comes down for it
ArmSwim=1           ; VR: 1 = in the water, strokes of your arms (open hands, thumbs off the sticks) swim, as in VHVR; 0 = the stick only

[Melee]
SwingSpeed=100      ; VR: the speed a swing needs to attack, percent (50 .. 150; lower = a lighter swing attacks); also changed in the game
HitStop=1           ; VR: 1 = when a melee stroke hits, the shown hand and weapon pause a moment (0.1 .. 0.3 s); 0 = no pause; also changed in the game

[Log]
Keep=8              ; how many of the newest log folders (EnshroudedVR\logs) stay; 0 = all
